# Overlay-Manifest – Register der eingebundenen Projektdokumente (Ebene 4)
# Mechanismus: .koolie/project-overlay/OVERLAY.md Abschnitt 19. Nicht registrierte Dokumente gelten als K3.
# Keine Secrets, keine Personen, keine internen Adressen. Rollen statt Personen.
# Validierung: python3 .koolie/core/tests/scripts/validate-framework.py prüft Schema und Pflichtfelder.

manifest_version: 1
project_code: "<PROJECT_CODE>"
overlay_version: "<TBD: 0.1.0>"

# Entscheidungsprotokoll des Schutz-Hooks (D-487): Standard an, eine Zeile je Entscheidung in
# .git/koolie-hook.jsonl, ohne Inhalt und ohne Pfad. Abschalten mit:
# hook_protokoll: aus
#
# Fremde Agenten-Rahmenwerke (K-31, D-514): Skills eines anderen Rahmenwerks in der Skill-Ablage
# des Clients (etwa OpenSpec, GitHub Spec Kit) hier mit ihrem Praefix deklarieren - der Validator
# prueft sie dann nicht als Koolie-Skills (Pruefung 111); den Korb der Berechtigungsdatei
# verlangt er weiter (Pruefung 72). install.py nennt erkannte Rahmenwerke. Beispiel:
# fremde_skills: openspec-, speckit-

# Zulässige Werte
#   type:          ai-governance | ai-process-model | roadmap | architecture | coding-guidelines |
#                  definition-of-ready | definition-of-done | branching-strategy | deployment |
#                  security | quality | roles | glossary | other
#   context_class: K1 | K2          (K3-Dokumente werden nicht registriert)
#   status:        entwurf | aktuell | veraltet
#   load:          summary | on-demand | rule | never
#   approved_by:   generische Rolle

# Kategoriefreigaben (02-privacy.md Abschnitt 3.4 und 4, Schritt 3; D-455). Ohne Eintrag gilt der Ausschluss.
# Eine Freigabe gilt nie für eine Kategorie aus 02-privacy.md Abschnitt 2.1.
# category_releases:
#   - category: "Kommentarverläufe aus <ISSUE_TRACKER>"
#     approved_by: "<APPROVAL_ROLE>"
#     approved_on: "<TBD: Datum>"
#     sanitization: "Personen, Kontaktdaten und Kundenangaben entfernen; nur Anforderung oder Entscheidung übernehmen"

documents:
  - id: "DOC-001"
    type: "coding-guidelines"
    title: "<TBD: Titel ohne Projekt- oder Kundenbezug>"
    path: ".koolie/project-overlay/documents/coding-guidelines/<TBD: datei>.md"
    context_class: "K1"
    status: "entwurf"
    load: "rule"
    rule_file: "<RULES_DIR>/21-overlay-coding-guidelines.md"
    approved_by: "<APPROVAL_ROLE>"
    approved_on: "<TBD: Datum>"
    sanitization: "<TBD: was vor der Einbindung entfernt wurde, oder 'nicht erforderlich'>"
    notes: "<TBD>"

  - id: "DOC-002"
    type: "architecture"
    title: "<TBD>"
    path: ".koolie/project-overlay/documents/architecture/<TBD>.md"
    context_class: "K2"
    status: "entwurf"
    load: "on-demand"
    approved_by: "<ARCHITECT_ROLE>"
    approved_on: "<TBD>"
    sanitization: "<TBD: z. B. Kapitel Infrastruktur und Betriebsumgebungen entfernt>"
    notes: "K2: Freigabe je Aufgabe erforderlich"

  - id: "DOC-003"
    type: "definition-of-done"
    title: "<TBD>"
    path: ".koolie/project-overlay/documents/definition-of-done/<TBD>.md"
    context_class: "K1"
    status: "entwurf"
    load: "summary"
    approved_by: "<APPROVAL_ROLE>"
    approved_on: "<TBD>"
    sanitization: "nicht erforderlich"
    notes: "Kernaussagen in <RULES_DIR>/20-project-overlay.md übernehmen"
